<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio-Website</title>
    <link rel="stylesheet" href="style.css">

<link rel="shortcut icon" href="https://t4.ftcdn.net/jpg/05/94/38/27/360_F_594382716_SA2EelKT0OuHMO78lYv3JRXWMuCwkTLD.jpg" type="image/x-icon">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>

</head>
<body>
    <div id="wrapper">
        <div class="container">
            <div class="navbar">
                <div class="logo-container">
                    <img src="images/A.png" class="logo" alt="Logo">
                    <div class="logo-text">aryan Awasthi</div>
                </div>
                <div class="nav-items">
                    <div><a href="#projects">Projects</a></div>
                    <div><a href="#skills">Skills</a></div>
                    <div><a href="#contactMe">Contact Me</a></div>

                  </div>
            </div>
            <div class="hero-section">
                <div class="faded-text">Aaryan Awasthi</div>
                <div class="hero-left-section">
                    <div class="hero-section-heading">
                        Hi! Aryan Awasthi
                    </div>
                    <div class="hero-section-subheading">
                        i'm a <span class="role"></span>
                    </div>
                    <div class="hero-section-description">
                        <p>I'm a passionate web developer with a knack for creating dynamic and responsive websites. I love coding and I'm always eager to learn new technologies.</p>
                </div>
                <div class="btn-hire-me">Hire me</div>
        </div>
        <div class="hero-right-section">
          
            
            <div class="absolute icons icon-square">
                <img src="images/cube.png" alt="">
            </div>
            <div class="absolute icons icon-cross">
               
                <img src="images/plus.png" alt="">
            </div>
            <div class="absolute icons icon-circle">
                
                <img src="images/dots.png" alt="">
            </div>
            <div class="absolute icons icon-zigzag">
                <img src="images/zigzags.png" alt="">
            </div>

            <div class="user-image">
                <img src="images/AARYAN.jpg" class="my-pic"alt="">
            </div>




        </div>
        
    </div>
    </div>
    </div>

        <script>
            var typeData = new Typed(".role", {
              strings: [
                "Full Stack Developer",
                "DSA-enthusiast",
                "Frontend Developer",
                "MERN Stack Developer"
              ],
              loop: true,
              typeSpeed: 100,
              backSpeed: 80,
              backDelay: 1000,
            });
          </script>
          
</body>
</html>
